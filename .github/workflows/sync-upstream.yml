name: Sync Upstream & Build Intel

on:
  schedule:
    # Every 30 minutes to quickly react to upstream releases
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: check upstream and apply patches without pushing/tagging'
        required: false
        default: 'false'
      force:
        description: 'Force: re-sync even if the latest upstream tag already exists (for testing patches)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  sync:
    name: Check upstream for new tags
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.check.outputs.new_tag }}
    steps:
      - name: Checkout downstream
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch latest upstream tags
        id: check
        run: |
          set -euo pipefail
          # Fetch upstream tags without cloning the full repo
          git ls-remote --tags --sort=-version:refname \
            https://github.com/opensquilla/opensquilla.git \
            'refs/tags/v*' \
            > /tmp/upstream-tags.txt

          # Get the latest upstream stable tag (exclude rc, alpha, beta, dev, deploy)
          LATEST_UPSTREAM=$(grep -oP 'refs/tags/v\d+\.\d+\.\d+$' /tmp/upstream-tags.txt | head -1 || true)

          if [ -z "$LATEST_UPSTREAM" ]; then
            echo "No stable upstream tag found"
            echo "new_tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG_NAME="${LATEST_UPSTREAM#refs/tags/}"
          echo "Latest upstream stable tag: $TAG_NAME"

          # Check if we already have this tag
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            if [ "${{ github.event.inputs.force }}" == "true" ]; then
              echo "Force mode: re-syncing existing tag $TAG_NAME (verification)"
            else
              echo "Tag $TAG_NAME already exists downstream, nothing to sync"
              echo "new_tag=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "new_tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "New upstream tag found: $TAG_NAME"

  build:
    name: Sync ${{ needs.sync.outputs.new_tag }} and build Intel
    needs: sync
    if: needs.sync.outputs.new_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    env:
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      FORCE: ${{ github.event.inputs.force || 'false' }}
    steps:
      - name: Checkout upstream at tag
        uses: actions/checkout@v4
        with:
          repository: opensquilla/opensquilla
          ref: ${{ needs.sync.outputs.new_tag }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply macOS Intel patches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.sync.outputs.new_tag }}"
          TAG="${VERSION#v}"

          # 1. Pin onnxruntime <= 1.23.0 for macOS Intel wheels
          sed -i.bak 's/"onnxruntime>=1.17"/"onnxruntime>=1.17,<=1.23.0"/' pyproject.toml
          # Also handle if already has version constraint
          sed -i.bak 's/"onnxruntime>=1.17,<=[^"]*"/"onnxruntime>=1.17,<=1.23.0"/' pyproject.toml
          rm -f pyproject.toml.bak

          # 1a. Verify onnxruntime constraint was applied
          if ! grep -qE 'onnxruntime>=1\.17,<=1\.23\.0' pyproject.toml; then
            echo "ERROR: onnxruntime constraint not applied correctly"
            cat pyproject.toml | grep -i onnxruntime || true
            exit 1
          fi
          echo "Verified: onnxruntime <= 1.23.0 pinned"

          # 2. Set Python version to 3.12.12
          echo "3.12.12" > .python-version

          # 3. Replace wheelhouse-release.yml with the Intel-only version from this repo
          gh api "repos/${{ github.repository }}/contents/.github/workflows/wheelhouse-release.yml" \
            --jq '.content' | base64 -d > .github/workflows/wheelhouse-release.yml

          # 3a. Verify wheelhouse-release.yml is Intel-only
          if grep -qE 'build-desktop-macos-arm64|build-desktop-windows|runs-on: macos-13' .github/workflows/wheelhouse-release.yml; then
            echo "ERROR: wheelhouse-release.yml still contains non-Intel targets"
            grep -nE 'build-desktop-macos-arm64|build-desktop-windows|runs-on: macos-13' .github/workflows/wheelhouse-release.yml || true
            exit 1
          fi
          if ! grep -q 'build-desktop-macos-intel' .github/workflows/wheelhouse-release.yml; then
            echo "ERROR: wheelhouse-release.yml missing Intel build job"
            exit 1
          fi
          echo "Verified: wheelhouse-release.yml is Intel-only"

      - name: Apply custom patches
        run: |
          set -euo pipefail
          mkdir -p /tmp/patches
          PATCHES_DIR="patches"

          # Fetch list of .patch files from the downstream repo
          gh api "repos/${{ github.repository }}/contents/${PATCHES_DIR}" \
            --jq '.[] | select(.name | endswith(".patch")) | .name' \
            > /tmp/patch-list.txt 2>/dev/null || echo "" > /tmp/patch-list.txt

          if [ ! -s /tmp/patch-list.txt ]; then
            echo "No custom patches found, skipping"
            exit 0
          fi

          echo "Found custom patches:"
          cat /tmp/patch-list.txt

          while IFS= read -r patch_name; do
            echo "Downloading: $patch_name"
            gh api "repos/${{ github.repository }}/contents/${PATCHES_DIR}/${patch_name}" \
              --jq '.content' | base64 -d > "/tmp/patches/${patch_name}"
          done < /tmp/patch-list.txt

          # Apply each patch
          for patch_file in /tmp/patches/*.patch; do
            echo "Applying: $(basename "$patch_file")"
            if ! git apply --check "$patch_file" 2>/dev/null; then
              echo "ERROR: Patch $(basename "$patch_file") does not apply cleanly."
              echo "The upstream code has changed. Please update your custom patches."
              exit 1
            fi
            git apply "$patch_file"
            echo "Applied: $(basename "$patch_file")"
          done

          echo "Custom patches applied successfully"

      - name: Force push to downstream main
        env:
          DOWNSTREAM_REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          if [ "${DRY_RUN}" == "true" ]; then
            echo "Dry run: skipping push to downstream main"
            exit 0
          fi
          git remote add downstream "$DOWNSTREAM_REPO"
          # [skip ci] prevents CI from running on this push
          git commit --amend -m "$(git log -1 --pretty=%B) [skip ci]" --allow-empty
          git push --force downstream HEAD:main

      - name: Push tag to downstream
        env:
          DOWNSTREAM_REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          if [ "${DRY_RUN}" == "true" ]; then
            echo "Dry run: skipping tag push"
            exit 0
          fi
          TAG="${{ needs.sync.outputs.new_tag }}"
          VERSION="${TAG#v}"
          git tag -a "$TAG" -m "OpenSquilla $VERSION macOS Intel"
          git push downstream "$TAG"
          echo "Pushed tag $TAG to downstream"

      - name: Trigger Intel release build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${DRY_RUN}" == "true" ]; then
            echo "Dry run: skipping workflow trigger"
            exit 0
          fi
          gh workflow run "Release macOS Intel Assets" \
            --repo "${{ github.repository }}" \
            --field tag="${{ needs.sync.outputs.new_tag }}"