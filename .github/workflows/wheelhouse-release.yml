name: Release macOS Intel Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Optional existing tag to upload artifacts to
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-assets-intel-${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag || github.run_id }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}

jobs:
  build-control-ui:
    name: Build verified Web UI artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG != '' && env.RELEASE_TAG || github.ref }}

      - name: Detect Web UI artifact contract
        id: webui-contract
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f opensquilla-webui/.node-version \
             && -f opensquilla-webui/package-lock.json \
             && -f opensquilla-webui/scripts/verify-dist.mjs ]]; then
            echo "mode=source-built" >> "${GITHUB_OUTPUT}"
          elif [[ -f src/opensquilla/gateway/static/dist/index.html ]]; then
            echo "mode=legacy-committed" >> "${GITHUB_OUTPUT}"
          else
            echo "No source-build contract or legacy committed Web UI artifact found" >&2
            exit 1
          fi

      - name: Set up Node.js
        if: steps.webui-contract.outputs.mode == 'source-built'
        uses: actions/setup-node@v4
        with:
          node-version-file: opensquilla-webui/.node-version
          cache: npm
          cache-dependency-path: opensquilla-webui/package-lock.json

      - name: Install Web UI dependencies
        if: steps.webui-contract.outputs.mode == 'source-built'
        working-directory: opensquilla-webui
        run: npm ci

      - name: Build and verify Web UI
        if: steps.webui-contract.outputs.mode == 'source-built'
        working-directory: opensquilla-webui
        run: |
          npm run build
          npm run verify:release-dist

      - name: Validate legacy committed Web UI
        if: steps.webui-contract.outputs.mode == 'legacy-committed'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("src/opensquilla/gateway/static/dist")
          assert (root / "index.html").is_file(), "legacy Web UI entrypoint is missing"
          allowed_music = {"music/README.md", "music/playlist.json"}
          personal_music = sorted(
              path.relative_to(root).as_posix()
              for path in (root / "music").rglob("*")
              if path.is_file() and path.relative_to(root).as_posix() not in allowed_music
          ) if (root / "music").is_dir() else []
          assert not personal_music, (
              f"personal BGM is forbidden in legacy release artifacts: {personal_music}"
          )
          playlist = root / "music/playlist.json"
          if playlist.is_file():
              data = json.loads(playlist.read_text(encoding="utf-8"))
              assert isinstance(data, dict) and data.get("tracks") == [], (
                  "legacy official music/playlist.json must keep tracks empty"
              )
          print("Validated legacy committed Web UI artifact")
          PY

      - name: Upload Web UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: opensquilla-release-webui-dist
          path: src/opensquilla/gateway/static/dist/
          if-no-files-found: error
          retention-days: 31
          overwrite: true

  build-desktop-macos-intel:
    name: Build macOS Electron installer (Intel)
    needs: build-control-ui
    # Cross-compile x64 on Apple Silicon (macos-latest) to avoid macos-13
    # queue starvation. electron-builder --x64 produces a native x64 DMG.
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG != '' && env.RELEASE_TAG || github.ref }}

      - name: Download verified Web UI artifact
        uses: actions/download-artifact@v4
        with:
          name: opensquilla-release-webui-dist
          path: src/opensquilla/gateway/static/dist/

      - name: Hydrate router assets
        run: git lfs pull --include="src/opensquilla/squilla_router/models/**"

      - name: Verify router assets are hydrated
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("src/opensquilla/squilla_router/models/v4.2_phase3_inference")
          required = [
              root / "PROVENANCE.md",
              root / "artifact_manifest.json",
              root / "bge_onnx" / "model.onnx",
              root / "features" / "tfidf.pkl",
              root / "lgbm_main.bin",
              root / "mlp" / "model.onnx",
              root / "router.runtime.yaml",
          ]
          for path in required:
              assert path.is_file(), f"missing router asset: {path}"
              prefix = path.read_bytes()[:80]
              assert not prefix.startswith(b"version https://git-lfs.github.com/spec/v1"), (
                  f"Git LFS pointer file is not hydrated: {path}"
              )
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: desktop/electron/package-lock.json

      - name: Install Electron dependencies
        working-directory: desktop/electron
        run: npm ci

      - name: Build unsigned macOS installer (x64)
        working-directory: desktop/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run build:gateway
          npm run build
          npx electron-builder --mac --x64 --publish never

      - name: Verify Electron package
        working-directory: desktop/electron
        run: npm run verify:package

      - name: Smoke packaged gateway
        working-directory: desktop/electron
        env:
          OPENSQUILLA_REQUIRE_PACKAGED_GATEWAY_SMOKE: "1"
          OPENSQUILLA_GATEWAY_SMOKE_TIMEOUT_MS: "240000"
        run: npm run verify:gateway-smoke

      - name: List macOS artifacts
        run: find dist/desktop-electron -maxdepth 2 -type f -print

      - name: Upload macOS Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opensquilla-electron-macos-intel
          path: |
            dist/desktop-electron/*-mac-x64.dmg
            dist/desktop-electron/*-mac-x64.zip
            dist/desktop-electron/*-mac-x64.dmg.blockmap
            dist/desktop-electron/*-mac-x64.zip.blockmap
            dist/desktop-electron/latest-mac.yml
          overwrite: true

  publish-release:
    name: Publish macOS Intel release
    needs:
      - build-desktop-macos-intel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        if: ${{ github.event_name == 'push' || github.event.inputs.tag != '' }}
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Download macOS Intel Electron assets
        uses: actions/download-artifact@v4
        with:
          name: opensquilla-electron-macos-intel
          path: dist

      - name: Regenerate release checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path

          def desktop_asset_version(version: str) -> str:
              return re.sub(r"(?<=\d)(a|b|rc)(\d+)$", r"-\1\2", version)

          dist = Path("dist")
          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          desktop_version = desktop_asset_version(version)
          asset_names = [
              f"OpenSquilla-{desktop_version}-mac-x64.dmg",
              f"OpenSquilla-{desktop_version}-mac-x64.zip",
              f"OpenSquilla-{desktop_version}-mac-x64.dmg.blockmap",
              f"OpenSquilla-{desktop_version}-mac-x64.zip.blockmap",
              "latest-mac.yml",
          ]
          lines = []
          for name in asset_names:
              path = dist / name
              assert path.is_file(), f"missing release asset for checksum: {name}"
              lines.append(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {name}")
          (dist / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Verify release asset set
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path

          def desktop_asset_version(version: str) -> str:
              return re.sub(r"(?<=\d)(a|b|rc)(\d+)$", r"-\1\2", version)

          dist = Path("dist")
          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          desktop_version = desktop_asset_version(version)
          sha256s = dist / "SHA256SUMS"
          asset_names = [
              f"OpenSquilla-{desktop_version}-mac-x64.dmg",
              f"OpenSquilla-{desktop_version}-mac-x64.zip",
              f"OpenSquilla-{desktop_version}-mac-x64.dmg.blockmap",
              f"OpenSquilla-{desktop_version}-mac-x64.zip.blockmap",
              "latest-mac.yml",
          ]
          assets = [dist / name for name in asset_names]
          assert sha256s.is_file(), "missing SHA256SUMS"
          for path in assets:
              assert path.is_file(), f"missing release asset: {path.name}"
          expected = [
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}"
              for path in assets
          ]
          assert sha256s.read_text(encoding="utf-8").splitlines() == expected
          PY

      - name: Upload aggregate workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: opensquilla-release-assets-intel
          path: dist/*
          overwrite: true

      - name: Upload to GitHub Release
        if: ${{ github.event_name == 'push' || github.event.inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          IS_PRERELEASE="$(python - <<'PY'
          import os
          import re

          tag = os.environ["TAG"]
          preview = re.search(
              r"(?:[-.]?(?:a|alpha|b|beta|rc|pre|preview))[0-9]+$",
              tag,
              flags=re.IGNORECASE,
          )
          print("true" if preview else "false")
          PY
          )"
          TITLE="OpenSquilla ${TAG#v} macOS Intel"
          NOTES_FILE="docs/releases/${TAG#v}.md"
          create_args=("${TAG}" --draft --verify-tag)
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            create_args+=(--prerelease)
          fi
          create_args+=(--title "${TITLE}")
          if [[ -f "${NOTES_FILE}" ]]; then
            create_args+=(--notes-file "${NOTES_FILE}")
          fi

          if gh release view "${TAG}" --json isDraft,isPrerelease >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, will upload assets."
          else
            gh release create "${create_args[@]}"
          fi

          python - <<'PY'
          import json
          import os
          import subprocess

          tag = os.environ["TAG"]
          raw = subprocess.check_output(
              ["gh", "release", "view", tag, "--json", "assets"],
              text=True,
          )
          data = json.loads(raw)
          for asset in data.get("assets", []):
              name = asset["name"]
              managed = (
                  name == "SHA256SUMS"
                  or name == "latest-mac.yml"
                  or name.startswith("OpenSquilla-")
                  or name.startswith("opensquilla-")
                  or name.endswith(".sha256")
              )
              if managed:
                  subprocess.run(
                      ["gh", "release", "delete-asset", tag, name, "--yes"],
                      check=True,
                  )
          PY
          gh release upload "${TAG}" dist/* --clobber

      - name: Verify GitHub Release assets
        if: ${{ github.event_name == 'push' || github.event.inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          def desktop_asset_version(version: str) -> str:
              return re.sub(r"(?<=\d)(a|b|rc)(\d+)$", r"-\1\2", version)

          tag = os.environ["TAG"]
          version = tag.removeprefix("v")
          desktop_version = desktop_asset_version(version)
          expected = {
              f"OpenSquilla-{desktop_version}-mac-x64.dmg",
              f"OpenSquilla-{desktop_version}-mac-x64.zip",
              f"OpenSquilla-{desktop_version}-mac-x64.dmg.blockmap",
              f"OpenSquilla-{desktop_version}-mac-x64.zip.blockmap",
              "latest-mac.yml",
              "SHA256SUMS",
          }
          raw = subprocess.check_output(
              [
                  "gh",
                  "release",
                  "view",
                  tag,
                  "--json",
                  "assets,isDraft,isPrerelease",
              ],
              text=True,
          )
          data = json.loads(raw)
          preview = re.search(
              r"(?:[-.]?(?:a|alpha|b|beta|rc|pre|preview))[0-9]+$",
              tag,
              flags=re.IGNORECASE,
          )
          if data.get("isDraft") is not True:
              print("Release asset verification requires a Draft release", file=sys.stderr)
              raise SystemExit(1)
          if data.get("isPrerelease") is not bool(preview):
              print("Release prerelease state does not match the tag", file=sys.stderr)
              raise SystemExit(1)
          names = {asset["name"] for asset in data.get("assets", [])}
          missing = sorted(expected - names)
          unexpected = sorted(names - expected)
          if missing or unexpected:
              print(
                  "Unexpected GitHub Release assets:",
                  {
                      "missing": missing,
                      "unexpected": unexpected,
                      "names": sorted(names),
                  },
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY
